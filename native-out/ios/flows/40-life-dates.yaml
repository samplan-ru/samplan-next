# «Дела» → «Важные даты»: «Добавить» opens the form (dateForm(null) — port/screens s-date-form),
# the row «День рождения мамы» its card (dateInfo — s-date). The tile «Даты» repeats the name of
# the nearest date, so the list is scrolled past it first.
appId: host.exp.Exponent
name: life-dates
---
- openLink: "exp://u.expo.dev/7263fb82-0eb4-44ac-81f6-fbd034e9af9b?channel-name=check"
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "(Continue|Got it|Продолжить)"
    optional: true
- extendedWaitUntil:
    visible: "Сегодня"
    timeout: 60000
- tapOn: "Дела"
- extendedWaitUntil:
    visible: "Календарь"
    timeout: 10000
- scrollUntilVisible:
    element: "Годовщина свадьбы"
    direction: DOWN
    timeout: 60000
# lift the target off the floating tab bar before tapping it
- swipe:
    start: 50%, 65%
    end: 50%, 45%
    duration: 900
- waitForAnimationToEnd
- tapOn:
    text: "Добавить"
    rightOf:
      text: "Важные даты"
- extendedWaitUntil:
    visible: "Или выбери:"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: s-date-form
- back
- extendedWaitUntil:
    notVisible: "Или выбери:"
    timeout: 5000
- tapOn: "День рождения мамы"
- extendedWaitUntil:
    visible: "Идея выбрана"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: s-date
