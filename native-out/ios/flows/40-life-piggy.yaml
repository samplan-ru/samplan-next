# «Дела» → «Копилки» → the jar «Отпуск в Турции»: its card opens (piggyInfo) — port/screens
# s-piggy.
appId: host.exp.Exponent
name: life-piggy
---
- openLink: "exp://u.expo.dev/7263fb82-0eb4-44ac-81f6-fbd034e9af9b?channel-name=check"
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "(Continue|Got it|Продолжить)"
    optional: true
- extendedWaitUntil:
    visible: "Сегодня"
    timeout: 60000
- tapOn: "Дела"
- extendedWaitUntil:
    visible: "Календарь"
    timeout: 10000
- scrollUntilVisible:
    element: "Отпуск в Турции"
    direction: DOWN
    timeout: 30000
# lift the target off the floating tab bar before tapping it
- swipe:
    start: 50%, 65%
    end: 50%, 45%
    duration: 900
- waitForAnimationToEnd
- tapOn: "Отпуск в Турции"
- extendedWaitUntil:
    visible: "Если откладывать"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: s-piggy
