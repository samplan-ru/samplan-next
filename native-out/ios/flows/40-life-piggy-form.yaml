# «Дела» → «Копилки» → «Завести»: the form «Новая копилка» opens (piggyForm) — port/screens
# s-piggy-form. Author 24.10: nothing opened on the phone. (The earlier 02-piggy scrolled to
# «Копилки», which the tile at the top already shows, so «Завести» stayed below the fold.)
appId: host.exp.Exponent
name: life-piggy-form
---
- openLink: "exp://u.expo.dev/7263fb82-0eb4-44ac-81f6-fbd034e9af9b?channel-name=check"
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "(Continue|Got it|Продолжить)"
    optional: true
- extendedWaitUntil:
    visible: "Сегодня"
    timeout: 60000
- tapOn: "Дела"
- extendedWaitUntil:
    visible: "Календарь"
    timeout: 10000
- scrollUntilVisible:
    element: "Завести"
    direction: DOWN
    timeout: 30000
# lift the target off the floating tab bar before tapping it
- swipe:
    start: 50%, 65%
    end: 50%, 45%
    duration: 900
- waitForAnimationToEnd
- tapOn: "Завести"
- extendedWaitUntil:
    visible: "Новая копилка"
    timeout: 10000
- assertVisible: "На что копишь"
- waitForAnimationToEnd
- takeScreenshot: s-piggy-form
