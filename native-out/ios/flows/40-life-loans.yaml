# «Дела» → tile «Кредиты»: the list opens (loansSheet — port/screens s-loans), the loan «Машина»
# its card (loanSheetOne — s-loan).
appId: host.exp.Exponent
name: life-loans
---
- openLink: "exp://u.expo.dev/7263fb82-0eb4-44ac-81f6-fbd034e9af9b?channel-name=check"
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "(Continue|Got it|Продолжить)"
    optional: true
- extendedWaitUntil:
    visible: "Сегодня"
    timeout: 60000
- tapOn: "Дела"
- extendedWaitUntil:
    visible: "Календарь"
    timeout: 10000
- tapOn: "Кредиты"
- extendedWaitUntil:
    visible: "Ближайший.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: s-loans
- tapOn: "Машина"
- extendedWaitUntil:
    visible: "Ежемесячный платёж"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: s-loan
