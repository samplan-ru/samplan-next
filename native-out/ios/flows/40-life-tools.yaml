# «Дела» → «Календарь» (calSheet — port/screens s-cal) and the tiles «Доход» (incomeSheet —
# s-income), «Отпуск» (vacSheet — s-vac), «Смены» (shiftsSheet — s-shifts). The tiles repeat the
# window titles, so each window is checked by a line of its own.
appId: host.exp.Exponent
name: life-tools
---
- openLink: "exp://u.expo.dev/7263fb82-0eb4-44ac-81f6-fbd034e9af9b?channel-name=check"
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "(Continue|Got it|Продолжить)"
    optional: true
- extendedWaitUntil:
    visible: "Сегодня"
    timeout: 60000
- tapOn: "Дела"
- extendedWaitUntil:
    visible: "Календарь"
    timeout: 10000
- tapOn: "Календарь"
- extendedWaitUntil:
    visible: "Предыдущий месяц"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: s-cal
- back
- extendedWaitUntil:
    notVisible: "Предыдущий месяц"
    timeout: 5000
- tapOn: "Доход"
- extendedWaitUntil:
    visible: "Добавить доход"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: s-income
- back
- extendedWaitUntil:
    notVisible: "Добавить доход"
    timeout: 5000
- tapOn: "Отпуск"
- extendedWaitUntil:
    visible: "Хочу взять"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: s-vac
- back
- extendedWaitUntil:
    notVisible: "Хочу взять"
    timeout: 5000
- tapOn: "Смены"
- extendedWaitUntil:
    visible: "График"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: s-shifts
