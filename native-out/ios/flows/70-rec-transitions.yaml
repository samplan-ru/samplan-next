# Screen recordings of window transitions on the device, for frame-by-frame analysis (05.11: the
# author saw the add-loan form «draw itself in»). Not a check of its own: the videos land next to
# the shots (Maestro startRecording), ios-check publishes them; tooling/native-check/frames.py
# cuts them into frames. Only in the group «70», run on request.
appId: host.exp.Exponent
name: rec-transitions
---
- stopApp
- openLink: "exp://u.expo.dev/7263fb82-0eb4-44ac-81f6-fbd034e9af9b?channel-name=check"
- extendedWaitUntil:
    visible: "Open"
    timeout: 6000
    optional: true
- tapOn:
    text: "Open"
    optional: true
- repeat:
    while:
      visible: "Open in .*"
    times: 4
    commands:
      - tapOn:
          text: "Open"
          optional: true
      - waitForAnimationToEnd
- tapOn:
    text: "(Continue|Got it|Продолжить)"
    optional: true
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn:
          text: "(Close|Закрыть)"
          optional: true
- runFlow:
    when:
      visible: "Reload"
    commands:
      - swipe:
          start: "50%,52%"
          end: "50%,98%"
- extendedWaitUntil:
    visible: "Сегодня"
    timeout: 120000
- extendedWaitUntil:
    visible: "[\\s\\S]*(нов(ое|ых) событи|платёж «| · бюджет )[\\s\\S]*"
    timeout: 4000
    optional: true
- extendedWaitUntil:
    notVisible: "[\\s\\S]*(нов(ое|ых) событи|платёж «| · бюджет )[\\s\\S]*"
    timeout: 10000
    optional: true
# a sheet from the head: the slide in
- startRecording: rec-karma
- tapOn: "Карма(, .*)?"
- extendedWaitUntil:
    visible: ".*очков честности.*"
    timeout: 6000
- waitForAnimationToEnd
- stopRecording
- tapOn:
    point: "50%,8%"
- extendedWaitUntil:
    notVisible: ".*очков честности.*"
    timeout: 5000
- tapOn: "Дела"
- extendedWaitUntil:
    visible: "Календарь"
    timeout: 10000
# the loans list, then «Добавить кредит» (list → form in the same window), then back
- startRecording: rec-loans-open
- tapOn: "Кредиты"
- extendedWaitUntil:
    visible: "Ближайший.*"
    timeout: 10000
- waitForAnimationToEnd
- stopRecording
- startRecording: rec-loan-add
- tapOn: ".*Добавить кредит.*"
- extendedWaitUntil:
    visible: ".*Новый кредит.*"
    timeout: 10000
- waitForAnimationToEnd
- stopRecording
- startRecording: rec-loan-cancel
- tapOn: "Отмена"
- extendedWaitUntil:
    visible: "Ближайший.*"
    timeout: 10000
- waitForAnimationToEnd
- stopRecording
