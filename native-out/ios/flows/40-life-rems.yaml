# «Дела» → «Напоминания» → «Добавить»: «Что напомнить» (remKindPick — port/screens s-rem-kind),
# then «Лекарства и витамины» (remForm('med') — s-rem-med) and, reopened, «Запись и визит»
# (remForm('appt') — s-rem-appt).
appId: host.exp.Exponent
name: life-rems
---
- openLink: "exp://u.expo.dev/7263fb82-0eb4-44ac-81f6-fbd034e9af9b?channel-name=check"
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "(Continue|Got it|Продолжить)"
    optional: true
- extendedWaitUntil:
    visible: "Сегодня"
    timeout: 60000
- tapOn: "Дела"
- extendedWaitUntil:
    visible: "Календарь"
    timeout: 10000
- tapOn: "Добавить"
- extendedWaitUntil:
    visible: "Что напомнить"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: s-rem-kind
- tapOn: "Лекарства и витамины"
- extendedWaitUntil:
    visible: "Что принимать"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: s-rem-med
- back
- extendedWaitUntil:
    notVisible: "Что принимать"
    timeout: 5000
- tapOn: "Добавить"
- extendedWaitUntil:
    visible: "Что напомнить"
    timeout: 10000
- tapOn: "Запись и визит"
- extendedWaitUntil:
    visible: "Куда записан"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: s-rem-appt
